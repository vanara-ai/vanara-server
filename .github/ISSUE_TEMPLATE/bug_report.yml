name: Bug report
description: Something isn't working as expected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill in the details below so we can reproduce and fix it.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug. Include full error messages / stack traces.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start backend with `uvicorn app.main:app --reload`
        2. POST a PDF to /optimize_resume/ with X-Groq-Key header
        3. Observe 500 error...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version / commit SHA
      placeholder: "main @ a1b2c3d, or release v0.1.0"

  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.11.7"
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Local (venv)
        - Docker / docker-compose
        - Render / Railway / Fly.io
        - Other
      default: 0
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant backend logs
      description: Redact any API keys, emails, or PII before pasting.
      render: shell

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I have searched existing issues and this is not a duplicate
          required: true
        - label: I have redacted any API keys or PII from this report
          required: true
